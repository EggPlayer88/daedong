# 문서 본문은 INSTREAM으로만 받는다. TCP 포트를 열지 않는다.
Foreground yes
User workhub
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.ctl
LocalSocketMode 660
FixStaleSocket yes
TemporaryDirectory /tmp
LogTime yes
LogClean no
LogVerbose no
LogFileMaxSize 0
# 스트림 거부가 clean으로 처리되지 않도록 앱 상한 100 MiB와 맞춘다.
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 400M
MaxRecursion 20
MaxFiles 10000
MaxThreads 2
MaxQueue 8
ReadTimeout 30
CommandReadTimeout 30
SendBufTimeout 500
SelfCheck 600
# 검사 한도 초과를 깨끗한 파일로 취급하지 않는다.
AlertExceedsMax yes
AlertEncrypted yes
