# PR 자동 검사 — main 에 합치기 전에 npm test 전체가 통과해야 한다.
# GitHub 보호 규칙에서 이 검사(test)를 "필수"로 지정해 빨간불이면 병합 버튼이 막히게 한다.
name: test

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # 운영과 관계없는 합성 시험 DB이며 작업이 끝나면 함께 폐기된다.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workhub_contract_test
          POSTGRES_USER: workhub_test
          POSTGRES_PASSWORD: workhub_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhub_test -d workhub_contract_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 문서만 바꾼 PR은 브라우저 설치를 생략한다. 공통 앱·시험·의존성 변경은 전부 검사한다.
      - name: 브라우저 검사 대상 확인
        id: browser-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'
          let run = true
          if (/^[0-9a-f]{40}$/i.test(process.env.BASE_SHA || '') && !/^0+$/.test(process.env.BASE_SHA)) {
            try {
              const files = execFileSync('git', ['diff', '--name-only', '-z', process.env.BASE_SHA, process.env.HEAD_SHA], { encoding: 'utf8' }).split('\0')
              run = files.some(path => /^(apps\/workhub\/|apps\/main\/src\/|packages\/shared\/|tests\/browser\/|tests\/helpers\/|scripts\/export-workhub-preview\.mjs$|package(?:-lock)?\.json$|\.github\/workflows\/)/.test(path))
            } catch { console.log('변경 경로를 판정하지 못해 브라우저 검사를 실행합니다.') }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `run=${run}\n`)
          console.log(`브라우저 검사 실행: ${run}`)
          NODE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Python 테스트(generate.py·extract.py)는 lxml 이 필요하다.
      # 러너는 lxml 이 없으면 Python 몫을 건너뛰므로, 여기서 반드시 설치해 건너뛰는 일이 없게 한다.
      - run: pip install lxml
      - run: npm ci
      - run: npm test
        env:
          PYTHON: python
      - run: npm run test:workhub:postgres
        env:
          WORKHUB_TEST_DATABASE_URL: postgresql://workhub_test:workhub_test_only@127.0.0.1:5432/workhub_contract_test
          WORKHUB_TEST_ALLOW_FIXTURES: '1'
      # 신규 앱의 타입 검사와 일반 빌드도 확인한다. 배포나 메뉴 공개는 하지 않는다.
      - run: npm run build
      - run: npm run build:workhub
      # 같은 필수 test 검사 안에서 실행하여 브라우저 회귀가 나면 전체 검사가 실패한다.
      - name: Chromium 및 한글 글꼴 준비
        if: steps.browser-scope.outputs.run == 'true'
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: 실제 브라우저 회귀 검사
        if: steps.browser-scope.outputs.run == 'true'
        run: npm run test:workhub:browser
        env:
          PLAYWRIGHT_CHANNEL: chromium
          WORKHUB_QA_OUTPUT: ${{ runner.temp }}/workhub-browser-results
      - name: 브라우저 검사 결과 보관
        if: always() && steps.browser-scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: workhub-browser-results
          path: ${{ runner.temp }}/workhub-browser-results
          if-no-files-found: ignore
          retention-days: 7
