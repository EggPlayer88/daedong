# PR 자동 검사 — main 에 합치기 전에 npm test 전체가 통과해야 한다.
# GitHub 보호 규칙에서 이 검사(test)를 "필수"로 지정해 빨간불이면 병합 버튼이 막히게 한다.
name: test

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # 전체 SQL·브라우저 회귀가 늘어 정상 검사도 30분을 넘는다. 개별 시험 제한은 유지한다.
    timeout-minutes: 60
    services:
      # 운영과 관계없는 합성 시험 DB이며 작업이 끝나면 함께 폐기된다.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workhub_contract_test
          POSTGRES_USER: workhub_test
          POSTGRES_PASSWORD: workhub_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhub_test -d workhub_contract_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 문서만 바꾼 PR은 브라우저 설치를 생략한다. 공통 앱·시험·의존성 변경은 전부 검사한다.
      - name: 브라우저 검사 대상 확인
        id: browser-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync } from 'node:fs'
          let run = true
          if (/^[0-9a-f]{40}$/i.test(process.env.BASE_SHA || '') && !/^0+$/.test(process.env.BASE_SHA)) {
            try {
              const files = execFileSync('git', ['diff', '--name-only', '-z', process.env.BASE_SHA, process.env.HEAD_SHA], { encoding: 'utf8' }).split('\0')
              run = files.some(path => /^(apps\/workhub\/|apps\/main\/src\/|packages\/(?:shared|timetable)\/|tests\/browser\/|tests\/helpers\/|scripts\/export-workhub-preview\.mjs$|package(?:-lock)?\.json$|\.github\/workflows\/)/.test(path))
            } catch { console.log('변경 경로를 판정하지 못해 브라우저 검사를 실행합니다.') }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `run=${run}\n`)
          console.log(`브라우저 검사 실행: ${run}`)
          NODE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 기존 생성 시험의 lxml과 독립 파일 검사기의 PDF/OLE 파서를 함께 설치한다.
      # 형식별 시험은 의존성 누락을 실패로 처리하므로 미지원 성공으로 건너뛰지 않는다.
      - run: pip install -r workers/requirements.txt
      - run: pip install -r apps/main/requirements.txt
      # 시간표 결과는 실제 CP-SAT 엔진과 독립 검증기로 함께 확인한다.
      - run: pip install -r packages/timetable/requirements.txt
      - run: npm ci
      # 이번 통합 후보의 범위만 고정한다. 향후 승인된 DB/API 변경을 영구 차단하지 않는다.
      - name: 1차 통합 후보의 포함 이력과 보호 경계
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/workhub-integration'
        run: npm run check:workhub:integration
      - name: 2차 통합 후보의 포함 이력·SQL 원문·보류 경계
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/workhub-integration-r2'
        run: npm run check:workhub:integration:r2
      - name: 전체 시범 구축의 포함 이력·보존·보류 경계
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/workhub-pilot-completion'
        run: npm run check:workhub:pilot
      - name: 통합 후보의 앱·SQL 이력과 원문 보존
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/workhub-release-candidate'
        run: npm run check:workhub:release
      - name: 시간표 구축의 포함 이력과 SQL·인증·공개 보존
        if: github.event_name == 'pull_request' && (github.head_ref == 'feat/workhub-timetable-completion' || github.head_ref == 'feat/workhub-timetable-usability' || github.head_ref == 'feat/workhub-timetable-setup' || github.head_ref == 'feat/workhub-timetable-setup-batch' || github.head_ref == 'feat/workhub-timetable-flow-completion' || github.head_ref == 'feat/workhub-timetable-operations-completion')
        run: npm run check:workhub:timetable
      - name: 학교 연결·시간표 운영 묶음의 증분 승인 범위
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/workhub-school-timetable-pilot'
        run: npm run check:workhub:school-pilot
      - run: npm run check:workhub:design
      - run: npm test
        env:
          PYTHON: python
      - run: npm run test:workhub:postgres
        env:
          WORKHUB_TEST_DATABASE_URL: postgresql://workhub_test:workhub_test_only@127.0.0.1:5432/workhub_contract_test
          WORKHUB_TEST_ALLOW_FIXTURES: '1'
      # 운영 DB와 연결하지 않는다. 전용 로컬 PG17에서 적용 SQL 원문·앱 계약을 함께 검사한다.
      - name: R0·R1 시험용 PostgreSQL 17 준비
        run: |
          npm install --prefix "$RUNNER_TEMP/workhub-pg17" --no-save --package-lock=false @embedded-postgres/linux-x64@17.6.0-beta.15
          pip install psycopg2-binary
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          # embedded 서버의 libpq가 다른 주 버전의 시스템 psql에 섞이지 않도록 클라이언트만 격리한다.
          task_system_psql="$(command -v psql)"
          printf 'WORKHUB_CI_SYSTEM_PSQL=%s\n' "$task_system_psql" >> "$GITHUB_ENV"
          task_pg_lib="$RUNNER_TEMP/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/lib"
          WORKHUB_CI_SYSTEM_PSQL="$task_system_psql" LD_LIBRARY_PATH="$task_pg_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" scripts/ci-psql.sh --version
      - name: R0·R1 원본 전체 및 서버 작업자 SQL 통합 검사
        env:
          R0_PG_BIN: ${{ runner.temp }}/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/bin
          R0_WORK: ${{ runner.temp }}/workhub-r2-r0-verify
          R0_PG_PORT: '55447'
          WORKHUB_R2_SQL_REPORT: ${{ runner.temp }}/workhub-r2-sql-results
        run: |
          export R0_PSQL="$GITHUB_WORKSPACE/scripts/ci-psql.sh"
          npm run test:workhub:r2-sql
      - name: R0·R1 검사 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workhub-r2-sql-results
          path: ${{ runner.temp }}/workhub-r2-sql-results
          if-no-files-found: ignore
          retention-days: 7
      - name: 1~8단계 SQL과 현재 앱 통합 검사
        env:
          R0_PG_BIN: ${{ runner.temp }}/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/bin
          R0_WORK: ${{ runner.temp }}/workhub-release-r0-verify
          R0_PG_PORT: '55463'
        run: |
          export R0_PSQL="$GITHUB_WORKSPACE/scripts/ci-psql.sh"
          npm run test:workhub:release-sql
      - name: 1~8단계 통합 검사 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workhub-release-sql-results
          path: ${{ runner.temp }}/workhub-release-r0-verify/run-*/reports
          if-no-files-found: ignore
          retention-days: 7
      # 승인 회원 연결은 기존 회원과 접근 게이트를 보존한 새 격리 PG17에서 검사한다.
      - name: 학교 AI 키·공통 예산·실제 응답 대조
        env:
          P10_AI_PG_BIN: ${{ runner.temp }}/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/bin
          P10_AI_PORT: '55569'
          WORKHUB_AI_SQL_REPORT: ${{ runner.temp }}/workhub-ai-policy-results
        run: npm run test:workhub:ai-sql
      - name: 학교 AI 계약 검사 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workhub-ai-policy-results
          path: ${{ runner.temp }}/workhub-ai-policy-results
          if-no-files-found: ignore
          retention-days: 7
      - name: 개인 AI 기억 SQL·격리·원번호 복구·앱 응답
        env:
          M1_PG_BIN: ${{ runner.temp }}/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/bin
          M1_TEST_PORT: '55589'
          WORKHUB_AI_MEMORY_REPORT: ${{ runner.temp }}/workhub-ai-memory-results
        run: npm run test:workhub:memory-sql
      - name: 개인 AI 기억 검사 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workhub-ai-memory-results
          path: ${{ runner.temp }}/workhub-ai-memory-results
          if-no-files-found: ignore
          retention-days: 7
      - name: 학교 교사 연결 SQL·실제 응답 대조
        env:
          P9_PG_BIN: ${{ runner.temp }}/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/bin
          P9_CAPTURE: ${{ runner.temp }}/workhub-p9-captures.json
          P9_TEST_PORT: '55519'
        run: |
          python database/workhub-school-data/p9/test/run_p9.py
          node tests/test_workhub_school_roster.mjs
          git diff --exit-code -- database/workhub-school-data/p9/P9-05_통합사후점검.sql
      - name: 학교 자료 정정 SQL·보호 이력·앱 응답
        env:
          P9_PG_BIN: ${{ runner.temp }}/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/bin
          P10_CAPTURE: ${{ runner.temp }}/workhub-p10-captures.json
          P9_TEST_PORT: '55549'
        run: |
          python database/workhub-school-data/p10/test/run_p10.py
          node tests/test_workhub_school_data_maintenance.mjs
      - name: 학교 자료 과거 원문·판 이력 SQL·앱 응답
        env:
          K1_PG_BIN: ${{ runner.temp }}/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/bin
          K1_TEST_PORT: '55579'
        run: python database/workhub-knowledge-history/k1/test/run_k1.py
      - name: 시간표 운영 확장 SQL·독립 승인·앱 응답
        env:
          P9_PG_BIN: ${{ runner.temp }}/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/bin
          T3_CAPTURE: ${{ runner.temp }}/workhub-t3-captures.json
          T3_TEST_PORT: '55529'
        run: |
          python database/workhub-timetable/t3/test/run_t3.py
          node tests/integration/timetable-interventions-capture.mjs "$T3_CAPTURE"
      - name: 연간 운영·관리자 연속성·기간 휴업 SQL 회귀
        env:
          P9_PG_BIN: ${{ runner.temp }}/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/bin
          AF1_CAPTURE: ${{ runner.temp }}/workhub-af1-captures.json
          AF1_TEST_PORT: '55639'
        run: |
          python database/workhub-annual/af1/test/build_check.py
          git diff --exit-code -- database/workhub-annual/af1/AF1-05_사후점검.sql
          python database/workhub-annual/af1/test/run_af1.py
          node tests/integration/annual-operations-capture.mjs "$AF1_CAPTURE"
      - name: 수합 상태·양식 동시 게시 SQL·원자성·앱 응답
        env:
          P9_PG_BIN: ${{ runner.temp }}/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/bin
          AF2_CAPTURE: ${{ runner.temp }}/workhub-af2-captures.json
          AF2_TEST_PORT: '55649'
        run: |
          python database/workhub-annual/af2/test/build_check.py
          git diff --exit-code -- database/workhub-annual/af2/AF2-02_사후점검.sql
          python database/workhub-annual/af2/test/run_af2.py
          node tests/integration/collection-presentation-capture.mjs "$AF2_CAPTURE"
      - name: 현재 운영 INT-10·OP1 위 AF1·AF2 동시 설치 회귀
        env:
          WORKHUB_DEPLOYMENT_PG_BIN: ${{ runner.temp }}/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/bin
          WORKHUB_DEPLOYMENT_TEST_PORT: '55659'
        run: python database/workhub-annual/af2/test/run_current_baseline.py
      - name: 실제 시간표 가져오기 SQL·원자성·앱 응답
        env:
          P9_PG_BIN: ${{ runner.temp }}/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/bin
          T4_CAPTURE: ${{ runner.temp }}/workhub-t4-captures.json
          T4_TEST_PORT: '55539'
          T4_WITH_OPERATIONS: '1'
        run: |
          python database/workhub-timetable/t4/test/run_t4.py
          node tests/test_workhub_timetable_import.mjs
      - name: 학교 정정·시간표 운영 확장 전체 설치 점검
        env:
          P9_PG_BIN: ${{ runner.temp }}/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/bin
          WORKHUB_INT_TEST_PORT: '55559'
        run: |
          python database/workhub-school-data/integration/test/run_integrated.py
          git diff --exit-code -- database/workhub-school-data/integration/INT-04_운영확장_통합점검.sql
      - name: 미적용 SQL 한 DB 통합·배포 목록 무결성
        env:
          WORKHUB_DEPLOYMENT_PG_BIN: ${{ runner.temp }}/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/bin
          WORKHUB_DEPLOYMENT_TEST_PORT: '55609'
          WORKHUB_DEPLOYMENT_REPORT: ${{ runner.temp }}/workhub-deployment-results
        run: node scripts/verify-workhub-deployment.mjs --integration-only
      - name: 미적용 SQL 통합 검증 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workhub-deployment-results
          path: ${{ runner.temp }}/workhub-deployment-results
          if-no-files-found: ignore
          retention-days: 7
      - name: 수합·생성문서·학교원문·시험 교사 메신저 SQL·Storage 접근 경계 회귀
        env:
          WORKHUB_DEPLOYMENT_PG_BIN: ${{ runner.temp }}/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/bin
          WORKHUB_DEPLOYMENT_TEST_PORT: '55619'
        run: python database/workhub-messaging-pilot/mp1/test/run_mp1.py
      - name: 지정 계정 업무 참여 SQL·통합 점검 재생성
        env:
          WORKHUB_DEPLOYMENT_PG_BIN: ${{ runner.temp }}/workhub-pg17/node_modules/@embedded-postgres/linux-x64/native/bin
          WORKHUB_DEPLOYMENT_TEST_PORT: '55629'
        run: |
          python database/workhub-participation/op1/build.py
          python database/workhub-participation/op1/build-catalog.py
          python database/workhub-participation/op1/package.py
          git diff --exit-code -- database/workhub-participation/op1
      # 신규 앱의 타입 검사와 일반 빌드도 확인한다. 배포나 메뉴 공개는 하지 않는다.
      - run: npm run build
      - run: npm run build:workhub
      # 같은 필수 test 검사 안에서 실행하여 브라우저 회귀가 나면 전체 검사가 실패한다.
      - name: Chromium 및 한글 글꼴 준비
        if: steps.browser-scope.outputs.run == 'true'
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: 실제 브라우저 회귀 검사
        if: steps.browser-scope.outputs.run == 'true'
        run: npm run test:workhub:browser
        env:
          PLAYWRIGHT_CHANNEL: chromium
          WORKHUB_QA_OUTPUT: ${{ runner.temp }}/workhub-browser-results
      - name: 브라우저 검사 결과 보관
        if: always() && steps.browser-scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: workhub-browser-results
          path: ${{ runner.temp }}/workhub-browser-results
          if-no-files-found: ignore
          retention-days: 7
      # Vercel은 main 작업공간만 설치한다. 전체 npm ci가 가리는 업무실 의존성 누락도 확인한다.
      - name: 배포 앱만 새로 설치하고 빌드
        run: |
          npm ci --workspace apps/main --ignore-scripts
          npm run build --workspace apps/main
