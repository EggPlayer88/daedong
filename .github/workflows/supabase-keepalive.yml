# Supabase 일시정지 방지 — 무료 요금제는 DB 활동이 7일 동안 없으면 프로젝트를 일시정지한다.
# 방학처럼 교사들이 접속하지 않는 기간에도 멈추지 않도록, 주 2회 DB 에 가벼운 조회를 1건 보낸다.
#
# - 조회 대상은 departments 1행. anon 키라 RLS 때문에 빈 배열([])이 돌아와도 정상이다
#   (쿼리가 Postgres 까지 실제로 실행되므로 활동으로 잡힌다). 데이터는 읽지도 바꾸지도 않는다.
# - 필요한 저장소 Secrets: SUPABASE_URL, SUPABASE_ANON_KEY
#   (Vercel 의 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY 와 같은 값)
# - 응답이 200 이 아니면 실패로 끝나 GitHub 이 메일로 알린다 — 조용히 실패하지 않게.
# - 유료(Pro) 로 전환하면 일시정지가 없으므로 이 파일은 지워도 된다.
name: supabase-keepalive

on:
  schedule:
    # 매주 월·목 09:00 KST (UTC 00:00). 간격이 최대 4일이라 7일 기준에 여유가 있다.
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Actions 탭에서 "Run workflow" 로 바로 확인할 수 있게

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Supabase DB 에 가벼운 조회 1건
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::저장소 Secrets 에 SUPABASE_URL / SUPABASE_ANON_KEY 가 없습니다 (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          status=$(curl -sS -o body.txt -w '%{http_code}' --retry 3 --retry-delay 10 \
            "${SUPABASE_URL%/}/rest/v1/departments?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase 응답 $status — 이미 일시정지됐다면 대시보드에서 Restore 하세요."
            head -c 500 body.txt
            exit 1
          fi
          echo "ok — Supabase 활동 기록됨"
